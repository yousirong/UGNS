# Single-GPU training profile. Effective batch = batch_size * grad_accum_steps.
batch_size: 2
grad_accum_steps: 4
use_checkpoint: true
use_amp: false

# Paper prior-training configuration
lr: 0.0001
num_epochs: 100
weight_decay: 0.01
warmup_steps: 1000
gradient_clip: 1.0
ema_decay: 0.9999
use_p2_weighting: true
p2_gamma: 1.0
p2_k: 1.0
image_size: 256
num_channels: 256
num_res_blocks: 2
attention_resolutions: "32,16,8"
diffusion_steps: 1000
noise_schedule: linear
