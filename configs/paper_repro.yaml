# Configuration used by the experiments that produced the manuscript tables.
ddim_steps: 100
timestep_schedule: karras
eta: 0.0
ensemble_size: 10
batch_size: 10
guidance_schedule: cosine
guidance_start: 0.34
guidance_end: 0.0
guidance_power: 1.7
range_weight: 0.95
null_weight: 1.15
lpf_mode: wavelet
lpf_wavelet: sym4
lpf_level: 3
lpf_kernel_size: 3
use_srad: true
srad_iterations: 15
srad_q0: 0.4
srad_delta_t: 0.25
db_range: 60
linear_mask_center: 0.4
linear_mask_steepness: 3.5
use_otsu_gate: true
fusion_strategy: uncertainty_blend
fusion_w_min: 0.7
fusion_w_max: 0.98
topk: 10
fusion_temperature: 1.7
